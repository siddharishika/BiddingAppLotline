# Lotline on Render — Docker Web Service (UI + API). Postgres stays on Aiven.
# Secrets are set in the Render dashboard (sync: false), not committed here.
#
# Note: Render Blueprints do not support runtime: java — use docker instead.
services:
  - type: web
    name: lotline
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/categories
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: APP_CORS_ORIGINS
        sync: false
      - key: HIKARI_MAX_POOL
        value: "3"
      - key: HIKARI_MIN_IDLE
        value: "1"
      - key: SPRING_JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.PostgreSQLDialect
