spring.application.name=lotline-test

spring.datasource.url=jdbc:h2:mem:lotline-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

lotline.payments.gateway-name=LotlinePay
lotline.payments.api-key=sk_test_lotline_demo
lotline.payments.currency=USD
lotline.auctions.scheduler-ms=3600000
