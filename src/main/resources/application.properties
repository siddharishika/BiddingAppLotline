spring.application.name=lotline
server.port=8080

# PostgreSQL — Aiven credentials go in config/application-aiven.properties (not here).
# mvn spring-boot:run activates the aiven profile so that file is loaded.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/lotline}
spring.datasource.username=${POSTGRES_USER:lotline}
spring.datasource.password=${POSTGRES_PASSWORD:lotline}
spring.datasource.driver-class-name=org.postgresql.Driver
# Aiven plans often allow ~20 connections total (some reserved). Default Hikari (10)
# is too large if local + Render share one service. Override with HIKARI_MAX_POOL.
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Simulated payment gateway (Stripe-style charge API)
lotline.payments.gateway-name=LotlinePay
lotline.payments.api-key=sk_test_lotline_demo
lotline.payments.currency=USD

# Close expired auctions every 5 seconds
lotline.auctions.scheduler-ms=5000

server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
